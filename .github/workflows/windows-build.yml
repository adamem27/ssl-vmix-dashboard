# Builds the self-updating Windows package (portable Node + prebuilt app) after every push to main
# and publishes it as the asset of the "windows-latest" release, where the launcher looks for updates.
name: windows package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: windows-package
jobs:
  build:
    # windows-2022: node-gyp does not recognise the newer Visual Studio on windows-latest yet.
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Assemble package
        run: |
          node scripts/build-deploy.mjs out/app
          Push-Location out/app
          npm install --omit=dev --no-audit --no-fund
          Pop-Location
          New-Item -ItemType Directory out/app/node | Out-Null
          Copy-Item (Get-Command node).Source out/app/node/node.exe
          Copy-Item vmix-sync/vmix-sync.mjs out/app/
          Copy-Item windows/* out/
      - name: Check the launcher parses
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/out/launcher.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: Smoke test
        run: |
          $env:DATA_DIR = "$env:RUNNER_TEMP/data"; $env:PORT = '4310'
          $p = Start-Process out/app/node/node.exe -ArgumentList 'out/app/app.cjs' -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..30) { Start-Sleep 1; try { if ((Invoke-RestMethod http://127.0.0.1:4310/api/health).ok) { $ok = $true; break } } catch { } }
          Stop-Process $p -Force
          if (-not $ok) { throw 'The dashboard did not start.' }
          if (-not (Test-Path "$env:RUNNER_TEMP/data/assets/ssl-vmix.xlsx")) { throw 'No workbook written.' }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path out/* -DestinationPath ssl-dashboard-windows.zip
          gh release view windows-latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create windows-latest --title 'Windows package (latest)' --notes 'Built automatically from main. Download ssl-dashboard-windows.zip, unzip, run "SSL Dashboard.bat".' --latest }
          gh release upload windows-latest ssl-dashboard-windows.zip --clobber
      - name: Test the launcher (download from the release, start, stop)
        run: |
          $d = "$env:RUNNER_TEMP/launcher"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item out/launcher.ps1 $d
          @{ token = '${{ github.token }}'; server = '' } | ConvertTo-Json | Set-Content "$d/config.json"
          $env:SSL_LAUNCHER_TEST = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$d/launcher.ps1"
          if ($LASTEXITCODE -ne 0) { throw "launcher test failed ($LASTEXITCODE)" }
          if (-not (Test-Path "$d/app/version.txt")) { throw 'launcher did not install the app' }
          Get-ChildItem $d
      - name: Test online mode (sync from a dashboard with a password)
        run: |
          $env:DATA_DIR = "$env:RUNNER_TEMP/server"; $env:PORT = '4320'; $env:DASHBOARD_PASSWORD = 'pw'
          $srv = Start-Process out/app/node/node.exe -ArgumentList 'out/app/app.cjs' -PassThru -NoNewWindow
          Start-Sleep 6
          Remove-Item env:DATA_DIR, env:PORT, env:DASHBOARD_PASSWORD
          $d = "$env:RUNNER_TEMP/launcher"
          @{ token = '${{ github.token }}'; server = 'http://127.0.0.1:4320'; password = 'pw' } | ConvertTo-Json | Set-Content "$d/config.json"
          $env:SSL_LAUNCHER_TEST = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$d/launcher.ps1"
          $code = $LASTEXITCODE
          Stop-Process $srv -Force
          if ($code -ne 0) { throw "sync test failed ($code)" }
          if (-not (Test-Path "$d/data/assets/ssl-vmix.xlsx")) { throw 'no xlsx synced' }
          if (-not (Test-Path "$d/data/assets/ssl-vmix.json")) { throw 'no json synced' }
      - name: Test the real start (local mode, no test shortcuts)
        run: |
          $d = "$env:RUNNER_TEMP/launcher"
          @{ token = '${{ github.token }}'; server = '' } | ConvertTo-Json | Set-Content "$d/config.json"
          Remove-Item env:SSL_LAUNCHER_TEST -ErrorAction SilentlyContinue
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$d/launcher.ps1" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/launcher-out.txt"
          $ok = $false
          foreach ($i in 1..60) { Start-Sleep 1; try { if ((Invoke-RestMethod http://127.0.0.1:4310/api/health).ok) { $ok = $true; break } } catch { } }
          Start-Sleep 8
          $alive = -not $p.HasExited
          Get-Content "$env:RUNNER_TEMP/launcher-out.txt"
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $p.HasExited) { Stop-Process $p -Force }
          if (-not $ok) { throw 'dashboard did not answer' }
          if (-not $alive) { throw 'launcher exited' }
          if (-not (Test-Path "$d/data/assets/ssl-vmix.xlsx")) { throw 'no workbook' }
