<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 3 L16 26 M16 5 L27 22 L16 22 Z M14 8 L5 22 L14 22 Z' stroke='%2338bdf8' stroke-width='2' fill='%230ea5e9'/><path d='M3 27 Q16 31 29 27' stroke='%2338bdf8' stroke-width='2' fill='none'/></svg>" />
    <title>SSL – commentator</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body class="bg-ink-950 text-ink-100 antialiased">
    <div id="root"></div>
    <script>
      // A white screen never stays: a script that cannot load, or a screen still empty after 15 s, loads the page
      // again with a fresh address (past every cache). At most once a minute, so a broken host cannot loop.
      (function () {
        var KEY = 'ssl-boot-retry';
        function again() {
          try { var at = Number(sessionStorage.getItem(KEY) || 0); if (Date.now() - at < 60000) return; sessionStorage.setItem(KEY, String(Date.now())); } catch (e) { return; }
          var u = new URL(window.location.href); u.searchParams.set('r', String(Date.now())); window.location.replace(u.toString());
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) again();
        }, true);
        setTimeout(function () { var r = document.getElementById('root'); if (r && !r.childElementCount) again(); }, 15000);
      })();
    </script>
    <script type="module" src="/src/static/main.tsx"></script>
  </body>
</html>
